name: Update Terragrunt Params
description: Updates params.hcl with dynamic values

inputs:
  params_file:
    description: Path to params.hcl
    required: true

runs:
  using: composite
  steps:
    - name: Update params.hcl
      shell: bash
      run: |
        set -e

        PARAMS_FILE="${{ inputs.params_file }}"

        if [ ! -f "$PARAMS_FILE" ]; then
          echo "ERROR: params.hcl not found at $PARAMS_FILE"
          exit 1
        fi

        echo "updating mcp_properties in $PARAMS_FILE"
        echo "MCP_PROPERTIES=$MCP_PROPERTIES"

        awk -v mp="$MCP_PROPERTIES" '
          BEGIN { replaced=0 }
          {
            if ($0 ~ /mcp_properties = /) {
              print "  mcp_properties = " mp
              replaced=1
            } else {
              print $0
            }
          }
          END {
            if (replaced == 0) {
              print "  mcp_properties = " mp
            }
          }
        ' "$PARAMS_FILE" > "$PARAMS_FILE.tmp" && mv "$PARAMS_FILE.tmp" "$PARAMS_FILE"

        echo "Updating model_properties in $PARAMS_FILE"
        echo "MODEL_PROPERTIES=$MODEL_PROPERTIES"

        awk -v mp="$MODEL_PROPERTIES" '
          BEGIN { replaced=0 }
          {
            if ($0 ~ /model_properties = /) {
              print "  model_properties = " mp
              replaced=1
            } else {
              print $0
            }
          }
          END {
            if (replaced == 0) {
              print "  model_properties = " mp
            }
          }
        ' "$PARAMS_FILE" > "$PARAMS_FILE.tmp" && mv "$PARAMS_FILE.tmp" "$PARAMS_FILE"

        echo "Final params.hcl:"
        cat "$PARAMS_FILE"
