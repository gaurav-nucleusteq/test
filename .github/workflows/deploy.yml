name: "POC: Handle Nested JSON Input"

on:
  workflow_dispatch:
    inputs:
      CONFIG_JSON:
        description: "Full JSON config input (can contain nested JSON fields)"
        required: true

run-name: POC-NestedJSON-${{ fromJson(inputs.CONFIG_JSON).entity_type }}

jobs:
  print-json:
    runs-on: ubuntu-latest

    env:
      CONFIG_JSON: ${{ inputs.CONFIG_JSON }}
      ENTITY_TYPE: ${{ fromJson(inputs.CONFIG_JSON).entity_type }}
      TOOL_NAMES: ${{ toJson(fromJson(inputs.CONFIG_JSON).tool_names) }}


    steps:
      - name: Print Full Input JSON
        run: |
          echo "Full CONFIG_JSON:"
          echo "$CONFIG_JSON"

      - name: Print Extracted Entity Type
        run: |
          echo "Entity Type: $ENTITY_TYPE"

      - name: Print Nested Tools JSON
        run: |
          echo "TOOL_NAMES: $TOOL_NAMES"
          echo "Formatted pretty version:"
          echo "$TOOL_NAMES" | jq .
